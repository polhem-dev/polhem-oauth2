name: Device Tests

# Builds the OAuthMaui sample and runs tests/Polhem.OAuth2.DeviceTests on each platform, in Release so the core package is
# trimmed the way an application trims it. It takes much longer than Build CI, so it runs only when started by hand, for
# example after a change to the loopback or HTTP code and before a release.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to test: all, or any of apple, android and windows separated by commas'
        default: all

permissions:
  contents: read

# The SDK and the workload set are pinned together, because the iOS workload requires one Xcode version and a newer
# workload can silently require a newer Xcode than the runner has. Change the three values together.
env:
  DEVICE_DOTNET_SDK: 10.0.300
  DEVICE_WORKLOAD_VERSION: 10.0.301.1
  DEVICE_XCODE: /Applications/Xcode_26.5.app
  DEVICE_TESTS: tests/Polhem.OAuth2.DeviceTests/Polhem.OAuth2.DeviceTests.csproj
  MAUI_SAMPLE: samples/OAuthMaui/OAuthMaui.csproj
  # The end-to-end tests sign in to tests/Polhem.OAuth2.FakeProvider, which each job starts with a CA of its own and
  # installs on the simulator, the emulator or the host (ADR-006).
  FAKE_PROVIDER: tests/Polhem.OAuth2.FakeProvider/Polhem.OAuth2.FakeProvider.csproj
  FAKE_PROVIDER_URL: https://localhost:7443

jobs:
  device-apple:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'apple')
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: ${{ env.DEVICE_DOTNET_SDK }}

      - name: Select Xcode
        run: sudo xcode-select --switch "$DEVICE_XCODE"

      - name: Install the MAUI workload
        run: dotnet workload install maui --version "$DEVICE_WORKLOAD_VERSION"

      - name: Build the sample for iOS
        run: dotnet build "$MAUI_SAMPLE" -f net10.0-ios

      - name: Build the sample for Mac Catalyst
        run: dotnet build "$MAUI_SAMPLE" -f net10.0-maccatalyst

      - name: Start the fake provider
        run: |
          ca="$RUNNER_TEMP/fake-provider-ca.pem"
          mkdir -p TestResults
          nohup dotnet run --project "$FAKE_PROVIDER" -c Release -- --port 7443 --ca-certificate "$ca" --Logging:LogLevel:Microsoft.AspNetCore.Server.Kestrel=Debug > "$GITHUB_WORKSPACE/TestResults/fake-provider.log" 2>&1 &
          for i in $(seq 1 180); do [ -f "$ca" ] && break; sleep 1; done
          test -f "$ca" || { cat "$GITHUB_WORKSPACE/TestResults/fake-provider.log"; exit 1; }
          echo "FAKE_PROVIDER_CA=$ca" >> "$GITHUB_ENV"

      - name: Boot an iOS simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS-26-5$")) | .value[] | select(.name == "iPhone 17 Pro")][0].udid')
          test -n "$udid" && test "$udid" != "null"
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Trust the fake provider on the simulator and the host
        run: |
          xcrun simctl keychain "$SIMULATOR_UDID" add-root-cert "$FAKE_PROVIDER_CA"
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$FAKE_PROVIDER_CA"

      - name: Run the device tests on the iOS simulator
        run: >
          dotnet test "$DEVICE_TESTS" -c Release -f net10.0-ios -r iossimulator-arm64
          -p:DeviceRunnersDevice="$SIMULATOR_UDID" -p:FakeProviderUrl="$FAKE_PROVIDER_URL" -p:DeviceRunnersDataTimeout=120
          --results-directory TestResults/ios --logger "trx;LogFileName=test-results.trx"

      - name: Run the device tests on Mac Catalyst
        run: >
          dotnet test "$DEVICE_TESTS" -c Release -f net10.0-maccatalyst -r maccatalyst-arm64
          -p:FakeProviderUrl="$FAKE_PROVIDER_URL" -p:DeviceRunnersDataTimeout=120
          --results-directory TestResults/maccatalyst --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: device-tests-apple
          path: TestResults
          if-no-files-found: ignore

  device-android:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    # The Linux runners give the emulator hardware acceleration through KVM; the macOS arm64 runners cannot.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: ${{ env.DEVICE_DOTNET_SDK }}

      - name: Install the MAUI workload
        run: dotnet workload install maui-android --version "$DEVICE_WORKLOAD_VERSION"

      - name: Build the sample for Android
        run: dotnet build "$MAUI_SAMPLE" -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"

      - name: Start the fake provider
        run: |
          ca="$RUNNER_TEMP/fake-provider-ca.pem"
          mkdir -p TestResults
          nohup dotnet run --project "$FAKE_PROVIDER" -c Release -- --port 7443 --ca-certificate "$ca" --Logging:LogLevel:Microsoft.AspNetCore.Server.Kestrel=Debug > "$GITHUB_WORKSPACE/TestResults/fake-provider.log" 2>&1 &
          for i in $(seq 1 180); do [ -f "$ca" ] && break; sleep 1; done
          test -f "$ca" || { cat "$GITHUB_WORKSPACE/TestResults/fake-provider.log"; exit 1; }
          echo "FAKE_PROVIDER_CA=$ca" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner reaches the host at 10.0.2.2, which DeviceRunners builds into the application. The script installs the
      # CA of the fake provider and forwards its port, and needs the root access of a google_apis image.
      - name: Run the device tests on the Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash tests/Polhem.OAuth2.DeviceTests/scripts/prepare-android-emulator.sh "$FAKE_PROVIDER_CA"
            dotnet test "$DEVICE_TESTS" -c Release -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:FakeProviderUrl="$FAKE_PROVIDER_URL" -p:DeviceRunnersDataTimeout=120 --results-directory TestResults/android --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: device-tests-android
          path: TestResults
          if-no-files-found: ignore

  device-windows:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: ${{ env.DEVICE_DOTNET_SDK }}

      - name: Install the MAUI workload
        run: dotnet workload install maui --version $env:DEVICE_WORKLOAD_VERSION

      - name: Build the sample for Windows
        run: dotnet build $env:MAUI_SAMPLE -f net10.0-windows10.0.19041.0

      - name: Start the fake provider and trust it on the host
        run: |
          $ca = Join-Path $env:RUNNER_TEMP 'fake-provider-ca.pem'
          New-Item -ItemType Directory -Force TestResults | Out-Null
          Start-Process dotnet -ArgumentList 'run', '--project', $env:FAKE_PROVIDER, '-c', 'Release', '--', '--port', '7443', '--ca-certificate', $ca, '--Logging:LogLevel:Microsoft.AspNetCore.Server.Kestrel=Debug' `
            -RedirectStandardOutput TestResults/fake-provider.log -RedirectStandardError TestResults/fake-provider.err
          for ($i = 0; $i -lt 180 -and -not (Test-Path $ca); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $ca)) { Get-Content TestResults/fake-provider.err; exit 1 }
          certutil -addstore -f Root $ca

      # The loopback test opens the default browser, Edge, whose first-run pages would stop it before the sign-in.
      - name: Turn off the first-run experience of Edge
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Name HideFirstRunExperience -Value 1 -Type DWord

      - name: Run the device tests on Windows
        run: >
          dotnet test $env:DEVICE_TESTS -c Release -f net10.0-windows10.0.19041.0
          -p:FakeProviderUrl=$env:FAKE_PROVIDER_URL -p:DeviceRunnersDataTimeout=120
          --results-directory TestResults/windows --logger "trx;LogFileName=test-results.trx"

      - name: Capture the screen
        if: failure()
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save((Join-Path (Resolve-Path TestResults) 'screen.png'))

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: device-tests-windows
          path: TestResults
          if-no-files-found: ignore
