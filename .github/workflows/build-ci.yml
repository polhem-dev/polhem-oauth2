name: Build CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # The .NET Framework and Windows Forms targets only build on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build packages
        shell: pwsh
        run: |
          $projects = @(
            'src/Polhem.OAuth2/Polhem.OAuth2.csproj',
            'src/Polhem.OAuth2.AspNet/Polhem.OAuth2.AspNet.csproj',
            'src/Polhem.OAuth2.AspNetCore/Polhem.OAuth2.AspNetCore.csproj',
            'src/Polhem.OAuth2.WinForms/Polhem.OAuth2.WinForms.csproj',
            'src/Polhem.OAuth2.Desktop/Polhem.OAuth2.Desktop.csproj'
          )
          foreach ($project in $projects) {
            dotnet build $project --configuration Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test
        run: dotnet test tests/Polhem.OAuth2.UnitTests/Polhem.OAuth2.UnitTests.csproj --configuration Release
